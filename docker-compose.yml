services:

  postgres:
    image: postgres:16-alpine
    container_name: mahchat-postgres
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mahchat

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data



  backend:
    build:
      context: ./python
      dockerfile: ../Dockerfile.backend

    container_name: mahchat-backend

    ports:
      - "8000:8000"

    depends_on:
      - postgres

    env_file:
      - .env

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mahchat
      DB_HOST: postgres
      DB_PORT: 5432

    volumes:
      - ./python:/app

    working_dir: /app

    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload



  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend

    container_name: mahchat-frontend

    ports:
      - "80:80"

    depends_on:
      - backend

    volumes:
      - ./frontend:/usr/share/nginx/html



volumes:
  postgres_data: